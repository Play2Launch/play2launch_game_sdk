name: SDK checks and build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: p2l-game-sdk
          path: |
            dist/
            README.md
            docs/
            examples/
            src/sdk.js
